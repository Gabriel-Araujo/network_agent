volumes:
  postgres-data:

services:
  db:
    container_name: agent-rag-db
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "5433:5432"
    env_file:
      # Ensure that the variables in .env match the same variables in devcontainer.json
      - .env
    network_mode: host

