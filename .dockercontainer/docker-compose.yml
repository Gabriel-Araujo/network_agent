volumes:
  postgres-data:

services:
  db:
    container_name: agent-rag-db
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - postgres-data:/home/postgres/pgdata
    ports:
      - "5433:5432"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
